name: Site

# The website (site/, built by tools/site/build_site.py with the README's screenshots): built and
# checked on every pull request and every push to main: every local link and anchor resolves, the
# page loads nothing from another site, and nothing names the planning notes. Publishes nothing:
# pages.yml does.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build and check the site
      run: python3 tools/site/build_site.py --out _site --check
