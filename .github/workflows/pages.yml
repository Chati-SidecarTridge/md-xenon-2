name: Pages

# Publishes the website to GitHub Pages as static HTML (no Jekyll) on every push to main that
# changes it, or by hand, at the address in site/CNAME (xenon2.sidecartridge.com). The
# repository's Pages source must be "GitHub Actions", with that address as its custom domain.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'icon.png'
      - 'tools/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - name: Build and check the site
      run: python3 tools/site/build_site.py --out _site --check
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - id: deployment
      uses: actions/deploy-pages@v4
